name: Build blog
on:
  push:
    branches: [main, master]
    paths: ['content/**', 'templates/**', 'scripts/**', 'site.config.json', 'assets/**']
  schedule:
    - cron: '5 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-blog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build.mjs
      - name: Commit hasil build
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add -A blog blog.html sitemap-blog.xml
          git diff --cached --quiet || git commit -m "build: update blog"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
